<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Guest House - Booking</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header style="text-align: center; padding: 20px;">
<h1>Book Your Stay</h1>
</header>
<nav style="background-color: #333; padding: 10px; text-align: center;">
<a href="index.html" style="color: #fff; margin: 0 15px; text-decoration: none;">Home</a>
<a href="about.html" style="color: #fff; margin: 0 15px; text-decoration: none;">About Us</a>
<a href="rooms.html" style="color: #fff; margin: 0 15px; text-decoration: none;">Rooms & Amenities</a>
<a href="booking.html" style="color: #fff; margin: 0 15px; text-decoration: none;">Booking</a>
<a href="contact.html" style="color: #fff; margin: 0 15px; text-decoration: none;">Contact</a>
<a href="reviews.html" style="color: #fff; margin: 0 15px; text-decoration: none;">Reviews</a>
</nav>

<section class="container" style="padding: 20px;">
<h2>Reservation Form</h2>
<form id="bookingForm">
<label for="name">Full Name:</label>
<input type="text" id="name" name="name" required />

<label for="email">Email:</label>
<input type="email" id="email" name="email" required />

<label for="phone">Phone Number:</label>
<input type="tel" id="phone" name="phone" required />

<label for="roomType">Room Type:</label>
<select id="roomType" name="roomType" required>
  <option value="">Select Room Type</option>
  <option value="Standard">Standard Room</option>
  <option value="Deluxe">Deluxe Suite</option>
</select>

<label for="checkIn">Check-In Date:</label>
<input type="date" id="checkIn" name="checkIn" required />

<label for="checkOut">Check-Out Date:</label>
<input type="date" id="checkOut" name="checkOut" required />

<!-- Display total amount dynamically -->
<p>Total Amount: <span id="totalAmount">0</span></p>

<label for="guests">Number of Guests:</label>
<input type="number" id="guests" name="guests" min="1" max="10" required />

<button type="submit">Book Now</button>
</form>

<div id="confirmation" style="display:none; margin-top:20px; background:#e0ffe0; padding:15px; border-radius:8px;">
<h3>Thank you for your booking!</h3>
<p>Contact Phone number to confirm reservation and provide proof of payment</p>
</div>
</section>

<script>
// Function to calculate nights and total
function calculateTotal() {
  const checkIn = document.getElementById('checkIn').value;
  const checkOut = document.getElementById('checkOut').value;
  const totalSpan = document.getElementById('totalAmount');

  if (checkIn && checkOut) {
    const checkInDate = new Date(checkIn);
    const checkOutDate = new Date(checkOut);
    const diffTime = checkOutDate - checkInDate;
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

    if (diffDays > 0) {
      const ratePerNight = 1175; // Your rate
      const totalCost = diffDays * ratePerNight;
      totalSpan.textContent = totalCost;
    } else {
      totalSpan.textContent = '0';
    }
  }
}

// Event listeners for date inputs
document.getElementById('checkIn').addEventListener('change', calculateTotal);
document.getElementById('checkOut').addEventListener('change', calculateTotal);

// Handle form submission
document.getElementById('bookingForm').addEventListener('submit', function(e) {
  e.preventDefault();

  // Gather form data
  const name = document.getElementById('name').value;
  const email = document.getElementById('email').value;
  const phone = document.getElementById('phone').value;
  const roomType = document.getElementById('roomType').value;
  const checkIn = document.getElementById('checkIn').value;
  const checkOut = document.getElementById('checkOut').value;
  const guests = document.getElementById('guests').value;
  const totalAmount = document.getElementById('totalAmount').textContent;

  // Build WhatsApp message
  const message = `New Booking:\nName: ${name}\nEmail: ${email}\nPhone: ${phone}\nRoom: ${roomType}\nCheck-in: ${checkIn}\nCheck-out: ${checkOut}\nGuests: ${guests}\nTotal: ${totalAmount}`;

  // WhatsApp number (include country code)
  const whatsappNumber = '27762688807'; // Your number
  const whatsappURL = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;

  // Open WhatsApp chat
  window.open(whatsappURL, '_blank');

  // Show confirmation message
  document.getElementById('bookingForm').style.display = 'none';
  document.getElementById('confirmation').style.display = 'block';

  // You can add backend form processing here if needed
});
</script>

<footer>
<p>&copy; 2022 - 2026 Five Star Guest House. All rights reserved.</p>
</footer>
</body>
</html>
